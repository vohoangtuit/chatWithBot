<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin:0; overflow:hidden; background-color: transparent; }
        canvas { display: block; outline: none; }
    </style>
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
</head>

<body>
<canvas id="canvas"></canvas>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. CÀI ĐẶT CƠ BẢN
    const canvas = document.getElementById("canvas");
    const scene = new THREE.Scene();

    // Đẩy camera ra xa một chút (z=3) để thấy rõ người hơn
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 3);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio); // Chống răng cưa trên điện thoại nét cao

    // 2. ÁNH SÁNG (Cần chỉnh lại để Avatar trông có khối 3D thật hơn)
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(3, 10, 10);
    scene.add(dirLight);

    // 3. TẢI AVATAR VÀ ANIMATION (Nếu có)
    const loader = new THREE.GLTFLoader();
    let mixer; // Bộ quản lý chuyển động (hô hấp, chớp mắt...)
    let avatarModel;

    // Sửa lại đường dẫn: Gọi trực tiếp tên file nằm cùng thư mục
    loader.load('./avatar.glb', function(gltf) {
        avatarModel = gltf.scene;

        // Hạ mô hình xuống một chút cho vừa khung hình
        avatarModel.position.y = -1;
        scene.add(avatarModel);

        // Nếu file GLB của anh có sẵn animation (ví dụ tải từ ReadyPlayerMe có idle animation)
        if (gltf.animations && gltf.animations.length > 0) {
            mixer = new THREE.AnimationMixer(avatarModel);
            const action = mixer.clipAction(gltf.animations[0]);
            action.play(); // Chạy animation mặc định (VD: đứng thở)
        }

        // Báo cho Flutter biết WebGL đã load xong mô hình
        if (window.FlutterChannel) {
            window.FlutterChannel.postMessage("AVATAR_READY");
        }
    }, undefined, function(error) {
        console.error("Lỗi tải GLB:", error);
    });

    // 4. VÒNG LẶP RENDER MƯỢT MÀ
    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);

        // Cập nhật chuyển động nếu có
        if (mixer) {
            mixer.update(clock.getDelta());
        }

        renderer.render(scene, camera);
    }
    animate();

    // 5. CẦU NỐI GIAO TIẾP VỚI FLUTTER (JS BRIDGE)
    // Cấp quyền truy cập Global để Flutter có thể gọi hàm này qua WebViewController
    window.playAvatarSpeech = function(text) {
        console.log("Flutter gửi lệnh: " + text);

        // Hiệu ứng nhép môi đơn giản: Cho Avatar gật gù/lắc lư khi nói
        if (avatarModel) {
            // Đây là hiệu ứng Demo: Avatar nhảy lên nhẹ khi bắt đầu nói
            avatarModel.position.y = -0.9;
            setTimeout(() => { avatarModel.position.y = -1; }, 200);
        }
    };

    // Xử lý khi xoay màn hình điện thoại
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
</script>
</body>
</html>
